name: Native executable
description: >
  Builds the native repolore executable for one platform on a runner of that platform, runs the smoke and the scenario
  suite against it, packages it for every channel, and installs each package the way a user would.
inputs:
  rid:
    description: 'Runtime identifier, for example linux-x64'
    required: true
  upload:
    description: 'Upload the packages as the artifact native-<rid>'
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install the native toolchain (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -q && sudo apt-get install -yq clang zlib1g-dev
    - name: Read the version
      shell: bash
      run: |
        version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
        test -n "$version"
        echo "REPOLORE_VERSION=$version" >> "$GITHUB_ENV"
        echo "NATIVE_OUT=$RUNNER_TEMP/native" >> "$GITHUB_ENV"
        echo "NATIVE_DIST=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
        exe=repolore; [ "$RUNNER_OS" = Windows ] && exe=repolore.exe
        echo "NATIVE_EXE=$RUNNER_TEMP/native/$exe" >> "$GITHUB_ENV"
    - name: Build the test project (locked restore)
      shell: bash
      run: |
        dotnet restore --locked-mode
        dotnet build --no-restore --configuration Release tests/RepoLore.Cli.Tests
    - name: Build the native executable (locked restore of the native lock files)
      shell: bash
      env:
        RID: ${{ inputs.rid }}
      run: |
        dotnet restore src/RepoLore.Cli/RepoLore.Cli.csproj -p:RepoLoreNative=true --locked-mode
        dotnet publish src/RepoLore.Cli/RepoLore.Cli.csproj --no-restore --configuration Release \
          --runtime "$RID" -p:RepoLoreNative=true --output "$NATIVE_OUT"
        ls -l "$NATIVE_OUT"
    - name: Smoke-test the executable
      shell: bash
      run: bash build/smoke-native.sh "$NATIVE_EXE" "$REPOLORE_VERSION"
    - name: Repeat the smoke with networking blocked (Linux x64)
      if: inputs.rid == 'linux-x64'
      shell: bash
      run: >
        sudo env "PATH=$PATH" bash build/run-without-network.sh
        bash build/smoke-native.sh "$NATIVE_EXE" "$REPOLORE_VERSION"
    - name: Run the scenarios against the executable
      shell: bash
      run: |
        bash build/clone-reference-repo.sh "$RUNNER_TEMP/reference"
        REPOLORE_REFERENCE_REPO="$RUNNER_TEMP/reference" REPOLORE_SCENARIO_EXECUTABLE="$NATIVE_EXE" \
        REPOLORE_SCENARIO_ARTIFACTS="$RUNNER_TEMP/scenario-failures" \
          dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests --filter "Category=Scenario"
    - name: Package the executable for every channel
      shell: bash
      env:
        RID: ${{ inputs.rid }}
      run: |
        python build/distribution.py archive "$RID" "$NATIVE_EXE" "$REPOLORE_VERSION" "$NATIVE_DIST"
        python build/distribution.py wheel "$RID" "$NATIVE_EXE" "$REPOLORE_VERSION" "$NATIVE_DIST"
        python build/distribution.py npm "$RID" "$NATIVE_EXE" "$REPOLORE_VERSION" "$RUNNER_TEMP/npm"
        (cd "$RUNNER_TEMP/npm" && for package in */; do npm pack "./$package" --pack-destination "$NATIVE_DIST"; done)
        # The main npm package is the same on every platform; the publish workflow builds the published one on Linux.
        python build/distribution.py npm-main "$REPOLORE_VERSION" "$RUNNER_TEMP/npm-main"
        mkdir -p "$RUNNER_TEMP/npm-test" && npm pack "$RUNNER_TEMP/npm-main/repolore-cli" --pack-destination "$RUNNER_TEMP/npm-test"
        ls -l "$NATIVE_DIST"
    - name: Install and run the wheel (pip, without Python at run time)
      shell: bash
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/venv/Scripts"; else bin="$RUNNER_TEMP/venv/bin"; fi
        "$bin/python" -m pip install --quiet "$NATIVE_DIST"/repolore-*.whl
        test "$("$bin/repolore" version | head -n 1 | tr -d '\r')" = "RepoLore $REPOLORE_VERSION"
    - name: Install and run the npm packages
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/npm-consumer" && cd "$RUNNER_TEMP/npm-consumer"
        npm init -y > /dev/null
        npm install --no-save --no-package-lock --omit=optional "$NATIVE_DIST"/repolore-org-cli-*.tgz "$RUNNER_TEMP"/npm-test/repolore-cli-*.tgz
        test "$(npx --no-install repolore version | head -n 1 | tr -d '\r')" = "RepoLore $REPOLORE_VERSION"
        set +e; npx --no-install repolore no-such-command; code=$?; set -e
        test "$code" -eq 2
    - name: Install with the website's install script, from a local copy of the release files
      shell: bash
      run: |
        python - <<'PY'
        import hashlib, os
        dist, version = os.environ["NATIVE_DIST"], os.environ["REPOLORE_VERSION"]
        with open(os.path.join(dist, f"repolore-{version}.sha256"), "w", newline="\n") as f:
            for name in sorted(os.listdir(dist)):
                if name.startswith("repolore-") and (name.endswith(".zip") or name.endswith(".tar.gz")):
                    f.write(hashlib.sha256(open(os.path.join(dist, name), "rb").read()).hexdigest() + "  " + name + "\n")
        PY
        # Loopback only: a server on every interface waits on the macOS firewall.
        (cd "$NATIVE_DIST" && python -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
        for attempt in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
        export REPOLORE_DOWNLOAD_BASE=http://127.0.0.1:8765 REPOLORE_INSTALL_DIR="$RUNNER_TEMP/installed"
        if [ "$RUNNER_OS" = Windows ]; then
          pwsh -NoProfile -File site/install.ps1
          exe="$REPOLORE_INSTALL_DIR/repolore.exe"
        else
          sh site/install.sh
          exe="$REPOLORE_INSTALL_DIR/repolore"
        fi
        test "$("$exe" version | head -n 1 | tr -d '\r')" = "RepoLore $REPOLORE_VERSION"
        rm "$NATIVE_DIST/repolore-$REPOLORE_VERSION.sha256"
    - name: Keep the failed scenarios' command logs and files
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: native-failures-${{ inputs.rid }}
        path: ${{ runner.temp }}/scenario-failures/
        if-no-files-found: ignore
    - name: Upload the packages
      if: inputs.upload == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: native-${{ inputs.rid }}
        path: ${{ env.NATIVE_DIST }}/
        if-no-files-found: error
