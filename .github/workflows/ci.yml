name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['_repolore/**', 'docs/**', 'AGENTS.md', 'method.md']
  pull_request:
    paths-ignore: ['_repolore/**', 'docs/**', 'AGENTS.md', 'method.md']
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release tests/RepoLore.Core.Tests
      - run: dotnet test --no-build --configuration Release tests/RepoLore.Infrastructure.Tests
      - run: dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests --filter "FullyQualifiedName!~RepoLore.Cli.Tests.Packaging"
      - name: Pack the tool and smoke-test the installed package from a local-only feed
        run: dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests --filter "FullyQualifiedName~RepoLore.Cli.Tests.Packaging"
      - name: Repeat the package smoke with networking blocked (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo env "PATH=$PATH" "DOTNET_ROOT=${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}"
          DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          bash build/run-without-network.sh
          dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests
          --filter "FullyQualifiedName~RepoLore.Cli.Tests.Packaging"
