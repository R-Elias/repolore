name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['_repolore/**', 'docs/**', 'AGENTS.md', 'method.md']
  pull_request:
    paths-ignore: ['_repolore/**', 'docs/**', 'AGENTS.md', 'method.md']
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release tests/RepoLore.Core.Tests
      - run: dotnet test --no-build --configuration Release tests/RepoLore.Infrastructure.Tests
      - run: dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests --filter "FullyQualifiedName!~RepoLore.Cli.Tests.Packaging&Category!=Scenario"
      - name: Pack the tool and smoke-test the installed package from a local-only feed
        run: dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests --filter "FullyQualifiedName~RepoLore.Cli.Tests.Packaging"
      - name: Repeat the package smoke with networking blocked (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo env "PATH=$PATH" "DOTNET_ROOT=${DOTNET_ROOT:-$(dirname "$(readlink -f "$(command -v dotnet)")")}"
          DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
          bash build/run-without-network.sh
          dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests
          --filter "FullyQualifiedName~RepoLore.Cli.Tests.Packaging"
      # The scenarios act as regression tests, so they run before a merge too; the scheduled workflow still catches
      # runner and SDK changes in weeks without pull requests. A pin moved to an unpushed stage fails here.
      - name: Clone the pinned reference repository
        shell: bash
        run: |
          bash build/clone-reference-repo.sh "$RUNNER_TEMP/reference"
          echo "REPOLORE_REFERENCE_REPO=$RUNNER_TEMP/reference" >> "$GITHUB_ENV"
          echo "REPOLORE_SCENARIO_ARTIFACTS=$RUNNER_TEMP/scenario-failures" >> "$GITHUB_ENV"
      - name: Run the scenarios on the packed tool
        run: dotnet test --no-build --configuration Release tests/RepoLore.Cli.Tests --filter "Category=Scenario"
      - name: Keep the failed scenarios' command logs and files
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: scenario-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/scenario-failures/
          if-no-files-found: ignore
